<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>보글하우스 4주년 · 피자 게임</title>
    <meta
      name="description"
      content="주방 알바가 되어 손님 주문대로 피자를 공평하게 잘라내는 5라운드 게임. 보글하우스 4주년 이벤트."
    />

    <!-- 파비콘 (보글 4주년 기념 케이크) -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Open Graph (카톡·페북·인스타·슬랙 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="보글하우스" />
    <meta property="og:title" content="보글하우스 4주년 · 피자 게임" />
    <meta
      property="og:description"
      content="손님이 말한 개수대로, 최대한 공평하게. 5라운드 피자 자르기에 도전하고 랭킹에 이름을 남겨보세요."
    />
    <meta property="og:url" content="https://bogle-4th-pizza-game.pages.dev/" />
    <meta
      property="og:image"
      content="https://oeaibswtpcakeggcfbmj.supabase.co/storage/v1/object/public/dimages/bogle-og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="보글하우스 4주년 피자 게임" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter/X 카드 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="보글하우스 4주년 · 피자 게임" />
    <meta
      name="twitter:description"
      content="손님이 말한 개수대로, 최대한 공평하게. 5라운드 피자 자르기 도전!"
    />
    <meta
      name="twitter:image"
      content="https://oeaibswtpcakeggcfbmj.supabase.co/storage/v1/object/public/dimages/bogle-og-image.png"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 시작 -->
      <section id="startScreen" class="screen active">
        <div class="logo-mark">
          <img src="bogle-logo.svg" alt="보글하우스" />
          <span class="badge">4th</span>
        </div>
        <h1>보글하우스<br /><span>4주년 기념 피자 게임</span></h1>
        <p class="tag">모두가 만족할 수 있도록 피자를 잘라주세요</p>
        <button id="startBtn" class="btn primary">시작하기</button>
        <button id="startRankBtn" class="btn ghost" hidden>랭킹 보기</button>
        <p class="fine">
          craft beer & highball house ·
          <a
            href="https://www.instagram.com/bogle_house_seoul/"
            target="_blank"
            rel="noopener"
            >@bogle_house_seoul</a
          >
        </p>
      </section>

      <!-- 인트로 컷신 (바 카운터 씬 · 사장님 둘) -->
      <section id="introScreen" class="screen">
        <div id="introStage" class="intro-stage">
          <div class="bar-wall"></div>
          <img id="bossA" class="boss" src="assets/boss-a.png" alt="사장님" />
          <img id="bossB" class="boss" src="assets/boss-b.png" alt="사장님" />
          <div class="bar-counter"></div>
          <div id="introLine" class="intro-box">
            <p id="introText" class="intro-box-text"></p>
            <span id="introCont" class="intro-cont">탭해서 계속 ▸</span>
          </div>
        </div>
      </section>

      <!-- 게임 -->
      <section id="gameScreen" class="screen">
        <div id="hud">
          <div class="hud-top">
            <span id="roundLabel">튜토리얼</span>
            <span id="timer">연습</span>
          </div>
          <div id="orderText">주문: 2조각</div>
        </div>
        <canvas id="game"></canvas>
        <div id="roundPunch"></div>

        <!-- 튜토리얼 코치 오버레이 — 탭으로 넘김. 대사는 아래 말풍선(#introBubble) -->
        <div id="coach" class="coach">
          <div class="coach-line"></div>
          <div class="coach-finger">👆</div>
        </div>

        <div id="introBubble" class="bubble"></div>
        <button id="doneBtn" class="btn done" style="display: none">
          완성!
        </button>

        <!-- 라운드 점수 팝업 -->
        <div id="roundScore" class="overlay">
          <div class="rs-card">
            <div class="rs-main">
              <div class="rs-fair">공평도 <b id="rsFair">–</b></div>
              <div class="rs-score" id="rsScore">+0</div>
            </div>
            <div class="rs-side">
              <div class="rs-bonus" id="rsBonus"></div>
              <div class="rs-comment" id="rsComment"></div>
            </div>
            <div class="rs-hint">탭해서 계속</div>
          </div>
        </div>
      </section>

      <!-- 결과 -->
      <section id="resultScreen" class="screen">
        <h2 id="gradeLabel">완벽해요</h2>
        <p id="gradeComment" class="comment"></p>
        <div class="total"><b id="totalScore">0</b><span>/ 633</span></div>
        <div id="roundBars" class="bars"></div>
        <div id="nickRow" class="nick-row">
          <input id="nickInput" maxlength="30" placeholder="닉네임" />
          <button id="submitBtn" class="btn primary">랭킹 등록</button>
        </div>
        <div id="playResult" class="play-result"></div>
        <div id="submitState" class="fine"></div>
        <div class="btn-row">
          <button id="viewRankBtn" class="btn primary" hidden>랭킹 보기</button>
          <button class="btn ghost retryBtn">다시</button>
        </div>
      </section>

      <!-- 랭킹 -->
      <section id="rankScreen" class="screen">
        <h2>랭킹</h2>
        <div id="rankList" class="rank-list"></div>
        <div class="btn-row">
          <button id="backToResult" class="btn ghost">결과로</button>
          <button class="btn primary retryBtn">다시 도전</button>
        </div>
      </section>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
