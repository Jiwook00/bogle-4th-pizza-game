<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>보글 피자게임 · 퍼널</title>
    <style>
      :root {
        --bg: #14100c;
        --card: #1e1813;
        --line: #2e261e;
        --ink: #f3ead9;
        --muted: #a2937d;
        --accent: #f2b134;
        --good: #7bc86c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 28px 18px 60px;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 2px;
        letter-spacing: -0.01em;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 22px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 22px;
      }
      .kpi {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 12px;
      }
      .kpi .n {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .kpi .l {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }
      .funnel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 16px 8px;
        margin-bottom: 18px;
      }
      .step {
        margin-bottom: 16px;
      }
      .step .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
      }
      .step .name {
        font-weight: 600;
      }
      .step .val {
        font-variant-numeric: tabular-nums;
      }
      .step .val b {
        font-size: 17px;
      }
      .step .val .u {
        color: var(--muted);
        font-size: 12px;
        margin-left: 6px;
      }
      .bar {
        height: 12px;
        background: #2a221a;
        border-radius: 7px;
        overflow: hidden;
      }
      .bar > span {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 7px;
        transition: width 0.6s ease;
      }
      .conv {
        text-align: center;
        color: var(--good);
        font-size: 12px;
        margin: 0 0 14px;
        font-variant-numeric: tabular-nums;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        margin-top: 20px;
      }
      .foot b {
        color: var(--ink);
      }
      button {
        background: none;
        border: 1px solid var(--line);
        color: var(--muted);
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .err {
        color: #e57373;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🍕 보글 피자게임 · 퍼널</h1>
      <div class="sub">방문 → 게임 시작 → 완주 → 등록</div>

      <div class="kpis" id="kpis"></div>
      <div class="funnel" id="funnel">불러오는 중…</div>

      <div class="foot">
        <span>참가자 <b id="players">–</b>명 · 최고 <b id="top">–</b>점</span>
        <button id="reload">새로고침</button>
      </div>
    </div>

    <script type="module">
      import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./src/config.js";

      const H = {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      };
      const $ = (id) => document.getElementById(id);

      // count=exact로 개수만 싸게
      async function count(path, query) {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/${path}?select=player_id&${query}`,
          { headers: { ...H, Prefer: "count=exact", Range: "0-0" } },
        );
        const range = res.headers.get("content-range") || "*/0";
        return Number(range.split("/")[1]) || 0;
      }

      const pct = (a, b) => (b > 0 ? Math.round((a / b) * 100) : 0);

      function step(name, val, uniq, width, conv) {
        return `
          <div class="step">
            <div class="row">
              <span class="name">${name}</span>
              <span class="val"><b>${val.toLocaleString()}</b><span class="u">순 ${uniq.toLocaleString()}</span></span>
            </div>
            <div class="bar"><span style="width:${width}%"></span></div>
          </div>
          ${conv != null ? `<p class="conv">▼ ${conv}%</p>` : ""}`;
      }

      async function load() {
        $("funnel").textContent = "불러오는 중…";
        try {
          // 퍼널 뷰(집계 1줄) — visits/game_starts/completes + 순(distinct) 카운트
          const fRes = await fetch(`${SUPABASE_URL}/rest/v1/funnel?select=*`, {
            headers: H,
          });
          if (!fRes.ok) throw new Error(`funnel ${fRes.status}`);
          const [f] = await fRes.json();

          const [players, topRows] = await Promise.all([
            count("leaderboard", "player_id=not.is.null"),
            fetch(
              `${SUPABASE_URL}/rest/v1/leaderboard?select=score&order=score.desc&limit=1`,
              { headers: H },
            ).then((r) => r.json()),
          ]);

          // 등록(registrations) = leaderboard 참가자 수 = players
          const v = f.visits,
            g = f.game_starts,
            c = f.completes;
          const base = Math.max(v, 1);

          $("kpis").innerHTML = `
            <div class="kpi"><div class="n">${(f.unique_visitors || 0).toLocaleString()}</div><div class="l">순 방문자</div></div>
            <div class="kpi"><div class="n">${(f.unique_completers || 0).toLocaleString()}</div><div class="l">완주자</div></div>
            <div class="kpi"><div class="n">${pct(f.unique_completers || 0, f.unique_visitors || 0)}%</div><div class="l">전환율</div></div>`;

          $("funnel").innerHTML =
            step("방문", v, f.unique_visitors || 0, 100, pct(g, base)) +
            step(
              "게임 시작",
              g,
              f.unique_starters || 0,
              pct(g, base),
              pct(c, Math.max(g, 1)),
            ) +
            step(
              "완주",
              c,
              f.unique_completers || 0,
              pct(c, base),
              pct(players, Math.max(c, 1)),
            ) +
            step("등록", players, players, pct(players, base), null);

          $("players").textContent = players.toLocaleString();
          $("top").textContent = topRows?.[0]?.score ?? "–";
        } catch (e) {
          $("funnel").innerHTML =
            `<p class="err">불러오기 실패: ${e.message}<br/>events 테이블/funnel 뷰가 아직 없을 수 있어요(SQL 실행 필요).</p>`;
        }
      }

      $("reload").addEventListener("click", load);
      load();
    </script>
  </body>
</html>
